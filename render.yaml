services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: touchgrass-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: "*"
      - key: AI_INFERENCE_PROVIDER
        value: fallback
      - key: GEMMA_MODEL
        value: gemma2:2b
      - key: PLACES_MODE
        value: osm

  # 2. React + Vite Frontend Static Site
  - type: web
    name: touchgrass-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_URL
        fromService:
          name: touchgrass-backend
          type: web
          property: host
